  <!-- crisp ECG stroke over the binary field -->
  <path d="M12 68 H40 L48 68 L58 28 L70 104 L82 44 L90 68 H116"
        fill="none" stroke="#F8FAFC" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12 68 H40 L48 68 L58 28 L70 104 L82 44 L90 68 H116"
        fill="none" stroke="#1F7CEC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
